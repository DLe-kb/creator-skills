name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Test XHS content analysis validators
        run: |
          python skills/xhs-viral-content-analysis/scripts/test_validate_analysis_result.py
          python skills/xhs-viral-content-analysis/scripts/test_validate_html_report.py
